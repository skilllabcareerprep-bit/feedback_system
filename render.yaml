services:
  - type: web
    name: training-feedback-system
    env: python
    plan: free
    buildCommand: >
      pip install -r requirements.txt &&
      python training_feedback_system/manage.py collectstatic --no-input --no-check
    startCommand: gunicorn training_feedback_system.wsgi:application --workers 2 --timeout 60
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_EMAIL
        value: "admin@example.com"
      - key: ADMIN_PASSWORD
        value: "Feedback@2026"
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost,127.0.0.1"
      - key: OPENAI_API_KEY
        value: "WILL_BE_SET_IN_RENDER_DASHBOARD"
      - key: DATABASE_URL
        fromService:
          name: training-feedback-db
          property: connectionString
    staticPublicPath: /static
    publicDir: ./training_feedback_system/staticfiles

  - type: pserv
    name: training-feedback-db
    env: postgres
    plan: free
    ipAllowList: []
    envVars:
      - key: POSTGRES_DB
        value: training_feedback
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        generateValue: true
